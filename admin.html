<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div>
            <span class="logo">⚙️ Panel de Administración</span>
            <span id="user-email" style="font-size: 0.8rem; margin-left: 15px; color: #666;"></span>
        </div>
        <nav>
            <a href="index.html">Ver Tienda</a>
            <button onclick="cerrarSesion()" style="background:none; border:none; color:#e63946; cursor:pointer; font-weight:bold; margin-left:15px;">Cerrar Sesión</button>
        </nav>
    </header>

    <main class="container">
        <!-- Pestañas de Navegación del Panel -->
        <div style="margin-bottom: 20px;">
            <button id="btn-tab-productos" onclick="cambiarPestana('productos')" style="padding: 8px 15px; background: #e63946; color: white; border: none; border-radius: 4px; cursor:pointer; font-weight:bold;">Gestión de Productos</button>
            <button id="btn-tab-tips" onclick="cambiarPestana('tips')" style="padding: 8px 15px; background: #ddd; color: #333; border: none; border-radius: 4px; cursor:pointer; font-weight:bold; margin-left: 10px;">Tips para Mamá</button>
        </div>

        <!-- SECCIÓN PRODUCTOS -->
        <section id="seccion-productos">
            <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <h3 id="form-titulo-prod" style="margin-bottom: 15px;">Agregar Nuevo Producto</h3>
                <form id="form-producto" onsubmit="guardarProducto(event)" style="display: flex; flex-direction: column; gap: 12px;">
                    <input type="hidden" id="prod-id">
                    <input type="text" id="prod-nombre" placeholder="Nombre del producto" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <input type="number" step="0.01" id="prod-precio" placeholder="Precio ($)" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <div>
                        <label style="font-size: 0.85rem; display: block; margin-bottom: 4px;">Imagen Principal</label>
                        <input type="file" id="prod-imagen-file" accept="image/*">
                    </div>
                    <input type="text" id="prod-categoria" placeholder="Categoría" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <textarea id="prod-descripcion" placeholder="Descripción..." rows="3" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                    
                    <!-- Colores dinámicos -->
                    <div style="background: #f1f1f1; padding: 10px; border-radius: 4px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-size: 0.85rem; font-weight: bold;">Colores con Fotos</span>
                            <button type="button" onclick="agregarCampoColor()" style="background: #ccc; border: none; padding: 4px 8px; font-size: 0.75rem; cursor:pointer; border-radius:3px;">+ Añadir Color</button>
                        </div>
                        <div id="contenedor-colores" style="display: flex; flex-direction: column; gap: 8px;"></div>
                    </div>

                    <div style="display: flex; gap: 20px;">
                        <label><input type="checkbox" id="prod-oferta"> En Oferta</label>
                        <label><input type="checkbox" id="prod-temporada"> De Temporada</label>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button type="submit" id="btn-submit-prod" style="background: #2a9d8f; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Guardar Producto</button>
                        <button type="button" id="btn-cancelar-prod" onclick="limpiarFormProducto()" style="display:none; background: #6c757d; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">Cancelar</button>
                    </div>
                </form>
            </div>

            <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <h3 style="margin-bottom: 15px;">Listado de Productos</h3>
                <div id="lista-productos" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </section>

        <!-- SECCIÓN TIPS PARA MAMÁ -->
        <section id="seccion-tips" style="display: none;">
            <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <h3 id="form-titulo-tip" style="margin-bottom: 15px;">Publicar Nuevo Tip para Mamá</h3>
                <form id="form-tip" onsubmit="guardarTip(event)" style="display: flex; flex-direction: column; gap: 12px;">
                    <input type="hidden" id="tip-id">
                    <input type="text" id="tip-titulo" placeholder="Título del artículo" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <input type="text" id="tip-breve" placeholder="Breve resumen o frase gancho" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <div>
                        <label style="font-size: 0.85rem; display: block; margin-bottom: 4px;">Imagen ilustrativa</label>
                        <input type="file" id="tip-imagen-file" accept="image/*">
                    </div>
                    <textarea id="tip-descripcion" placeholder="Contenido completo..." rows="4" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>

                    <div style="display: flex; gap: 10px;">
                        <button type="submit" id="btn-submit-tip" style="background: #e63946; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Publicar Tip</button>
                        <button type="button" id="btn-cancelar-tip" onclick="limpiarFormTip()" style="display:none; background: #6c757d; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">Cancelar</button>
                    </div>
                </form>
            </div>

            <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <h3 style="margin-bottom: 15px;">Tips Publicados</h3>
                <div id="lista-tips" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
