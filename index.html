<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bebé en Camino | Tienda y Blog</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Estructura general de la tienda con Grid de 2 columnas */
    .shop-main-layout {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 2rem;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    @media (max-width: 900px) {
      .shop-main-layout {
        grid-template-columns: 1fr;
      }
    }
    .products-column {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .sidebar-column {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    /* Estilo de la tarjeta de los Tips a la derecha */
    .blog-sidebar-card {
      background: #fff8fb;
      border: 1px solid #f8c291;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .blog-sidebar-card h3 {
      color: #e84393;
      margin-bottom: 1rem;
      font-size: 1.2rem;
      border-bottom: 2px solid #ffeaa7;
      padding-bottom: 0.5rem;
    }
    .blog-sidebar-item {
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #eee;
    }
    .blog-sidebar-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .blog-cat-tag {
      font-size: 0.75rem;
      font-weight: bold;
      color: #e84393;
      text-transform: uppercase;
    }
    .blog-sidebar-item h4 a {
      color: #333;
      text-decoration: none;
      font-size: 1rem;
    }
    .blog-sidebar-item h4 a:hover {
      color: #e84393;
    }
    .blog-sidebar-item p {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>

  <!-- Encabezado de la tienda -->
  <header style="background: #fff; padding: 1rem 2rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
    <h1>Bebé en Camino</h1>
    <nav>
      <a href="index.html" style="margin-right: 15px; text-decoration: none; color: #333; font-weight: bold;">Inicio</a>
      <a href="admin.html" style="text-decoration: none; color: #e84393; font-weight: bold;">Admin</a>
    </nav>
  </header>

  <!-- CONTENEDOR PRINCIPAL EN DOS COLUMNAS -->
  <div class="shop-main-layout">

    <!-- COLUMNA IZQUIERDA: Productos, Ofertas y Por Temporada -->
    <div class="products-column">
      
      <!-- Sección de Ofertas Especiales -->
      <section id="seccion-ofertas">
        <h2>Ofertas Especiales</h2>
        <div id="productos-ofertas-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem;">
          <!-- Se cargan por JS -->
        </div>
      </section>

      <!-- Sección Por Temporada -->
      <section id="seccion-temporada" style="margin-top: 1rem;">
        <h2>Por Temporada</h2>
        <div id="productos-temporada-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem;">
          <!-- Se cargan por JS -->
        </div>
      </section>

    </div>

    <!-- COLUMNA DERECHA: Tips y Consejos de Mamá (Debajo de Temporada visualmente) -->
    <div class="sidebar-column">
      
      <div class="blog-sidebar-card">
        <h3>💡 Tips y Consejos de Mamá</h3>
        <div id="blog-container-sidebar">
          <!-- Los artículos del blog se inyectan aquí automáticamente -->
        </div>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
