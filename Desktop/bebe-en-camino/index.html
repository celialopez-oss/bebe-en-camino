<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebé en Camino 👶 | Tienda Online</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Encabezado / Navbar -->
    <header class="navbar">
        <div class="logo">
            <img src="logo.PNG" alt="Bebé en Camino" style="height: 50px;">
        </div>
        <nav class="nav-links">
            <a href="#inicio">Inicio</a>
            <a href="#productos">Productos</a>
            <a href="#blog">Tips & Blog</a>
            <a href="#contacto">Contacto</a>
        </nav>
        <button class="cart-btn" onclick="toggleCart()">🛒 Carrito (<span id="cart-count">0</span>)</button>
    </header>

    <!-- Slider / Carrusel Automático -->
    <section id="inicio" class="slider-wrapper" style="overflow: hidden; position: relative;">
        <div id="slider-track" style="display: flex; width: 300%; transition: transform 0.5s ease-in-out;">
            <div class="slide" style="width: 100%; height: 300px; background: #ffe4e1; display: flex; align-items: center; justify-content: center;">
                <h2>Bienvenido a Bebé en Camino 👶</h2>
            </div>
            <div class="slide" style="width: 100%; height: 300px; background: #e0f7fa; display: flex; align-items: center; justify-content: center;">
                <h2>Las mejores ofertas para tu bebé 🍼</h2>
            </div>
            <div class="slide" style="width: 100%; height: 300px; background: #f3e5f5; display: flex; align-items: center; justify-content: center;">
                <h2>Envíos a todo el país 🚚</h2>
            </div>
        </div>
        <div class="dots-container" style="text-align:center; position: absolute; bottom: 10px; width: 100%;">
            <span class="dot active" onclick="setSlide(0)"></span>
            <span class="dot" onclick="setSlide(1)"></span>
            <span class="dot" onclick="setSlide(2)"></span>
        </div>
    </section>

    <!-- Filtros y Búsqueda -->
    <section class="controls-section">
        <input type="text" id="search-bar" placeholder="Buscar productos..." onkeyup="filterProducts()">
        <div class="category-filters">
            <button class="cat-btn active" onclick="filterByCategory('todos', this)">Todos</button>
            <button class="cat-btn" onclick="filterByCategory('ropa', this)">Ropa</button>
            <button class="cat-btn" onclick="filterByCategory('juguetes', this)">Juguetes</button>
            <button class="cat-btn" onclick="filterByCategory('accesorios', this)">Accesorios</button>
        </div>
    </section>

    <!-- Catálogo de Productos cargados dinámicamente -->
    <main id="productos">
        <h2>Nuestros Productos</h2>
        <div id="products-container" class="product-grid">
            <p>Cargando productos...</p>
        </div>
    </main>

    <!-- Blog & Tips desde Supabase -->
    <section id="blog">
        <h2>Consejos & Tips 🍼</h2>
        <div class="blog-posts">
            <!-- Se carga desde tu Supabase -->
        </div>
    </section>

    <!-- Modal del Carrito -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="toggleCart()">&times;</span>
            <h2>Tu Carrito</h2>
            <div id="cart-items"></div>
            <p>Total: $<span id="cart-total">0.00</span></p>

            <hr>
            <h3>Datos de envío</h3>
            <input type="text" id="cli-nombre" placeholder="Tu Nombre">
            <input type="text" id="cli-telefono" placeholder="Tu Teléfono (WhatsApp)">
            <input type="email" id="cli-email" placeholder="Tu Correo (Opcional)">
            <button onclick="checkout()">Realizar Pedido por WhatsApp</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
