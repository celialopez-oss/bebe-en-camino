<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Administración</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-gray-800">Panel de Control ⚙️</h1>
            <p class="text-xs text-gray-500" id="user-email">Conectado...</p>
        </div>
        <button onclick="cerrarSesion()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700 transition">Cerrar Sesión</button>
    </header>

    <!-- Navegación de Pestañas -->
    <main class="max-w-6xl mx-auto p-6">
        <div class="flex space-x-4 mb-6 border-b pb-3">
            <button onclick="cambiarPestana('productos')" id="btn-tab-productos" class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-pink-600 text-white shadow transition">Gestión de Productos</button>
            <button onclick="cambiarPestana('tips')" id="btn-tab-tips" class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-white text-gray-700 hover:bg-gray-200 transition">Tips y Consejos para Mamá</button>
        </div>

        <!-- SECCIÓN 1: PRODUCTOS -->
        <section id="seccion-productos" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 id="form-titulo-prod" class="text-lg font-bold text-gray-800 mb-4">Agregar Nuevo Producto</h2>
                <form id="form-producto" onsubmit="guardarProducto(event)" class="space-y-4">
                    <input type="hidden" id="prod-id">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="prod-nombre" placeholder="Nombre del producto" required class="border p-2.5 rounded-lg w-full focus:ring-2 focus:ring-pink-500 outline-none">
                        <input type="number" step="0.01" id="prod-precio" placeholder="Precio ($)" required class="border p-2.5 rounded-lg w-full focus:ring-2 focus:ring-pink-500 outline-none">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Imagen Principal (Archivo)</label>
                            <input type="file" id="prod-imagen-file" accept="image/*" class="border p-2 rounded-lg w-full bg-gray-50 text-sm">
                        </div>
                        <input type="text" id="prod-categoria" placeholder="Categoría (ej. Ropa, Juguetes...)" class="border p-2.5 rounded-lg w-full focus:ring-2 focus:ring-pink-500 outline-none">
                    </div>

                    <textarea id="prod-descripcion" placeholder="Descripción y características..." rows="3" class="border p-2.5 rounded-lg w-full focus:ring-2 focus:ring-pink-500 outline-none"></textarea>

                    <!-- Colores Dinámicos con Archivos -->
                    <div class="border p-4 rounded-lg bg-gray-50 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="font-semibold text-sm text-gray-700">Colores Disponibles (Archivos de imagen)</span>
                            <button type="button" onclick="agregarCampoColor()" class="bg-gray-200 text-gray-800 px-3 py-1 text-xs rounded hover:bg-gray-300 font-medium">+ Añadir Color</button>
                        </div>
                        <div id="contenedor-colores" class="space-y-2"></div>
                    </div>

                    <div class="flex items-center space-x-6">
                        <label class="flex items-center space-x-2 text-sm font-medium text-gray-700">
                            <input type="checkbox" id="prod-oferta" class="w-4 h-4 text-pink-600 rounded">
                            <span>Producto en Oferta</span>
                        </label>
                        <label class="flex items-center space-x-2 text-sm font-medium text-gray-700">
                            <input type="checkbox" id="prod-temporada" class="w-4 h-4 text-pink-600 rounded">
                            <span>Producto de Temporada</span>
                        </label>
                    </div>

                    <div class="flex space-x-3">
                        <button type="submit" id="btn-submit-prod" class="bg-green-600 text-white font-semibold px-6 py-2.5 rounded-lg hover:bg-green-700 transition">Guardar Producto</button>
                        <button type="button" id="btn-cancelar-prod" onclick="limpiarFormProducto()" class="hidden bg-gray-400 text-white font-semibold px-4 py-2.5 rounded-lg hover:bg-gray-500 transition">Cancelar Edición</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Inventario Actual</h3>
                <div id="lista-productos" class="space-y-3"></div>
            </div>
        </section>

        <!-- SECCIÓN 2: TIPS Y CONSEJOS -->
        <section id="seccion-tips" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 id="form-titulo-tip" class="text-lg font-bold text-gray-800 mb-4">Publicar Nuevo Tip o Consejo</h2>
                <form id="form-tip" onsubmit="guardarTip(event)" class="space-y-4">
                    <input type="hidden" id="tip-id">
                    <input type="text" id="tip-titulo" placeholder="Título del Artículo" required class="border p-2.5 rounded-lg w-full focus:ring-2 focus:ring-pink-500 outline-none">
                    <input type="text" id="tip-breve" placeholder="Breve mensaje o resumen corto" required class="border p-2.5 rounded-lg w-full focus:ring-2 focus:ring-pink-500 outline-none">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Imagen / Archivo ilustrativo</label>
                        <input type="file" id="tip-imagen-file" accept="image/*" class="border p-2 rounded-lg w-full bg-gray-50 text-sm">
                    </div>
                    <textarea id="tip-descripcion" placeholder="Descripción completa en formato de párrafo..." rows="5" required class="border p-2.5 rounded-lg w-full focus:ring-2 focus:ring-pink-500 outline-none"></textarea>
                    
                    <div class="flex space-x-3">
                        <button type="submit" id="btn-submit-tip" class="bg-pink-600 text-white font-semibold px-6 py-2.5 rounded-lg hover:bg-pink-700 transition">Publicar Tip</button>
                        <button type="button" id="btn-cancelar-tip" onclick="limpiarFormTip()" class="hidden bg-gray-400 text-white font-semibold px-4 py-2.5 rounded-lg hover:bg-gray-500 transition">Cancelar Edición</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Tips Publicados</h3>
                <div id="lista-tips" class="space-y-3"></div>
            </div>
        </section>
    </main>

    <!-- Lógica JavaScript -->
    <script src="admin.js"></script>
</body>
</html>
